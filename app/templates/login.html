<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StyleSync</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-bg">
    <div class="login-container">
        <div class="card login-card">
            <h2 class="text-center mb-4">Style<span class="text-red">Sync</span></h2>
            <div id="login-error" class="alert alert-error" style="display: none;"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('login-error');
            
            const payload = {
                username: this.username.value,
                password: this.password.value
            };

            btn.disabled = true;
            btn.textContent = 'Autenticando...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch("{{ url_for('main.get_login') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = "{{ url_for('frontend.dashboard_view') }}";
                } else {
                    errorDiv.textContent = data.message || "Erro de autenticação";
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = "Erro de conexão com o servidor.";
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar no Sistema';
            }
        });
    </script>
</body>
</html>
