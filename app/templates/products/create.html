{% extends "base.html" %}
{% block title %}Novo Produto - StyleSync{% endblock %}
{% block page_title %}Adicionar Produto{% endblock %}

{% block content %}
<div class="card form-card">
    <form id="productForm">
        <div class="form-group">
            <label for="name">Nome do Produto *</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group row">
            <div class="col-2">
                <label for="price">Preço (R$) *</label>
                <input type="number" id="price" name="price" step="0.01" class="form-control" required>
            </div>
            <div class="col-2">
                <label for="stock">Estoque Inicial *</label>
                <input type="number" id="stock" name="stock" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Descrição (Opcional)</label>
            <textarea id="description" name="description" class="form-control" rows="4"></textarea>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <a href="{{ url_for('frontend.products_list_view') }}" class="btn btn-outline mr-2">Cancelar</a>
            <button type="submit" class="btn btn-primary" id="saveBtn">Salvar Produto</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", () => checkAuth());

    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        const token = getToken();

        const payload = {
            name: this.name.value,
            price: parseFloat(this.price.value),
            stock: parseInt(this.stock.value),
            description: this.description.value || null
        };

        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
            const response = await fetch("{{ url_for('main.create_product') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                showFlash("Produto criado com sucesso!", "success");
                this.reset();
            } else {
                showFlash(JSON.stringify(data.error) || "Erro ao criar", "error");
            }
        } catch (error) {
            showFlash("Erro de conexão com o servidor", "error");
        } finally {
            btn.disabled = false;
            btn.textContent = 'Salvar Produto';
        }
    });
</script>
{% endblock %}
